server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    # # Allow large uploads ONLY for the image upload endpoint to prevent DDoS
    # location = /api/visual-search/v1/images/upload {
    #     client_max_body_size 1G;
    #     proxy_pass http://backend-java:8080/visual-search/v1/images/upload;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    # Keep the browser on the same origin and forward API calls to Spring Boot.
    # The trailing slash removes the /api prefix, matching the Vite dev proxy.
    location /api/ {
        proxy_pass http://backend-java:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
